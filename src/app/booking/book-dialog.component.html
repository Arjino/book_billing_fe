<div class="modern-dialog w-full max-w-lg text-white">
  <div class="dialog-header flex items-center justify-between p-3 rounded-t-lg" style="background: linear-gradient(90deg,#7C3AED,#06B6D4);">
    <div class="flex items-center gap-3">
      <mat-icon>menu_book</mat-icon>
      <h2 class="text-lg font-semibold">Add Book</h2>
    </div>
    <button mat-icon-button aria-label="close" (click)="onCancel()"><mat-icon>close</mat-icon></button>
  </div>

  <div mat-dialog-content class="p-4 rounded-b-lg" style="background: rgba(179,71,233,0.14); border: 1px solid rgba(179,71,233,0.95); backdrop-filter: blur(6px);">
    <form #bookForm="ngForm">
      <div class="grid grid-cols-1 gap-3">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Title</mat-label>
            <input matInput [(ngModel)]="data.title" name="title" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>SKU</mat-label>
            <input matInput [(ngModel)]="data.sku" name="sku" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Publisher</mat-label>
            <input matInput [(ngModel)]="data.publisher" name="publisher" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>HSN</mat-label>
            <input matInput [(ngModel)]="data.hsn" name="hsn" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Cost Price</mat-label>
            <input matInput type="number" [(ngModel)]="data.costPrice" name="costPrice" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Sale Price</mat-label>
            <input matInput type="number" [(ngModel)]="data.salePrice" name="salePrice" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Stock</mat-label>
            <input matInput type="number" [(ngModel)]="data.stock" name="stock" required />
          </mat-form-field>
        </div>
    </form>
  </div>

  <div mat-dialog-actions class="flex justify-end gap-2 p-3 bg-[rgba(0,0,0,0.6)] rounded-b-lg">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSave()">Save</button>
  </div>
</div>
