<div class="p-6">
  <h2 class="text-xl font-bold mb-4">Books
    <button mat-raised-button color="primary" (click)="addBook()" class="ml-4">Add</button>
  </h2>
  <table mat-table [dataSource]="books" class="w-full mb-6" *ngIf="books.length">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let b">{{b.id}}</td>
    </ng-container>
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let b">{{b.title}}</td>
    </ng-container>
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let b">{{b.stock}}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['id','title','stock']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id','title','stock'];"></tr>
  </table>
  <div *ngIf="!books.length" class="text-gray-500">No books found.</div>
</div>
