<div class="min-h-screen pt-20 pb-12 bg-gradient-to-br from-slate-950 via-purple-900/20 to-slate-950 relative overflow-hidden">
  <!-- Animated Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-green-500/10 rounded-full blur-3xl animate-blob"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
  </div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <!-- Header -->
    <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-4xl font-extrabold mb-2">
          <span class="bg-gradient-to-r from-green-400 to-emerald-400 bg-clip-text text-transparent">Books Management</span>
        </h1>
        <p class="text-green-200">Manage your book inventory</p>
      </div>
      <div class="flex gap-3 w-full md:w-auto justify-between md:justify-end mt-4 md:mt-0">
        <button mat-raised-button color="accent" (click)="addBook()" class="bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-600 hover:to-emerald-600">
          <mat-icon>add</mat-icon>
          Add Book
        </button>
        <button mat-icon-button (click)="goBack()" class="bg-slate-800/50 hover:bg-slate-700/50 text-green-300 rounded-lg border border-green-500/30" title="Back to Dashboard">
          <mat-icon>arrow_back</mat-icon>
        </button>
      </div>
    </div>

    <!-- Table Container -->
    <div class="bg-gradient-to-br from-slate-900/90 to-slate-950 border border-green-500/30 rounded-2xl backdrop-blur-xl overflow-hidden text-white">
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="books" class="w-full" *ngIf="books.length">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="text-green-300 font-bold py-4 px-6 text-left">ID</th>
              <td mat-cell *matCellDef="let b" class="text-green-300 py-4 px-6 border-t border-green-500/20">{{b.id}}</td>
          </ng-container>
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef class="text-green-300 font-bold py-4 px-6 text-left">Title</th>
              <td mat-cell *matCellDef="let b" class="text-green-300 py-4 px-6 border-t border-green-500/20">{{b.title}}</td>
          </ng-container>
          <ng-container matColumnDef="publisher">
            <th mat-header-cell *matHeaderCellDef class="text-green-300 font-bold py-4 px-6 text-left">Publisher</th>
              <td mat-cell *matCellDef="let b" class="text-green-300 py-4 px-6 border-t border-green-500/20">{{b.publisher}}</td>
          </ng-container>
          <ng-container matColumnDef="salePrice">
            <th mat-header-cell *matHeaderCellDef class="text-green-300 font-bold py-4 px-6 text-left">Selling Price</th>
              <td mat-cell *matCellDef="let b" class="text-green-300 py-4 px-6 border-t border-green-500/20">{{b.salePrice}}</td>
          </ng-container>
          <ng-container matColumnDef="sku">
            <th mat-header-cell *matHeaderCellDef class="text-green-300 font-bold py-4 px-6 text-left">SKU No</th>
              <td mat-cell *matCellDef="let b" class="text-green-300 py-4 px-6 border-t border-green-500/20">{{b.sku}}</td>
          </ng-container>
          <ng-container matColumnDef="stock">
            <th mat-header-cell *matHeaderCellDef class="text-green-300 font-bold py-4 px-6 text-left">Stock</th>
              <td mat-cell *matCellDef="let b" class="text-green-300 py-4 px-6 border-t border-green-500/20">{{b.stock}}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="['id','title','publisher','salePrice','sku','stock']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['id','title','publisher','salePrice','sku','stock'];" class="hover:bg-green-500/10 transition-colors"></tr>
        </table>
      </div>
      <div *ngIf="!books.length" class="p-8 text-center">
        <mat-icon class="text-6xl text-green-500/30 mb-4">inventory_2</mat-icon>
        <p class="text-green-300/60">No books found. Create your first book entry.</p>
      </div>
    </div>
  </div>
</div>
