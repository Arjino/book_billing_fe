<div *ngIf="isLoading$ | async" class="fixed inset-0 flex items-center justify-center z-50 bg-black/30 backdrop-blur-sm">
  <div class="flex flex-col items-center gap-4">
    <mat-spinner [diameter]="60" [strokeWidth]="4"></mat-spinner>
    <p class="text-white text-lg font-semibold">Loading...</p>
  </div>
</div>
