<div *ngIf="loading">Loading invoice PDF...</div>
<div *ngIf="error" class="error">{{ error }}</div>
<div *ngIf="pdfUrl && !loading">
  <!-- PDF preview using iframe -->
  <iframe [src]="pdfUrl" width="100%" height="600px" style="border: none;"></iframe>
  <button mat-raised-button color="primary" (click)="downloadPdf()">Download PDF</button>
</div>
