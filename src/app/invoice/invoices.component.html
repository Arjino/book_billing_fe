<div class="min-h-screen pt-20 pb-12 bg-gradient-to-br from-slate-950 via-indigo-900/20 to-slate-950 relative overflow-hidden">
  <div class="max-w-5xl mx-auto px-6 relative z-10">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-4xl font-extrabold mb-2">
          <span class="bg-gradient-to-r from-indigo-400 to-sky-400 bg-clip-text text-transparent">Invoices</span>
        </h1>
        <p class="text-indigo-200">Invoice list and PDF preview/download</p>
      </div>
      <div class="flex items-center">
        <button mat-icon-button aria-label="back" routerLink="/dashboard" class="text-indigo-200 hover:text-white"><mat-icon>arrow_back</mat-icon></button>
      </div>
    </div>

    <div class="bg-gradient-to-br from-slate-900/90 to-slate-950 border border-indigo-500/30 rounded-2xl p-6 backdrop-blur-xl text-white">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
        <mat-form-field appearance="outline" class="w-full text-white" [style.color]="'white'">
          <mat-label class="text-white">Party</mat-label>
          <mat-select class="text-white" [style.color]="'white'" [(ngModel)]="partyId" (selectionChange)="fetchInvoices(partyId)">
            <mat-option value="">All</mat-option>
            <mat-option *ngFor="let p of parties" [value]="p.id">{{ p.name }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full text-white" [style.color]="'white'">
          <mat-label class="text-white">Sale Type</mat-label>
          <mat-select class="text-white" [style.color]="'white'" [(ngModel)]="saleType">
            <mat-option value="All">All</mat-option>
            <mat-option value="Sale">Sale</mat-option>
            <mat-option value="Purchase">Purchase</mat-option>
            <mat-option value="Return">Return</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full text-white" [style.color]="'white'">
          <mat-label class="text-white">Start Date</mat-label>
          <input matInput [matDatepicker]="startPickerInv" class="text-white" [style.color]="'white'" [(ngModel)]="startDate" />
          <mat-datepicker-toggle matSuffix [for]="startPickerInv"></mat-datepicker-toggle>
          <mat-datepicker #startPickerInv></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full text-white" [style.color]="'white'">
          <mat-label class="text-white">End Date</mat-label>
          <input matInput [matDatepicker]="endPickerInv" class="text-white" [style.color]="'white'" [(ngModel)]="endDate" />
          <mat-datepicker-toggle matSuffix [for]="endPickerInv"></mat-datepicker-toggle>
          <mat-datepicker #endPickerInv></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="flex items-center justify-end mb-4">
        <button mat-raised-button color="primary" (click)="applyLocalFilters()">Apply Filters</button>
      </div>

      <div class="overflow-x-auto bg-[rgba(255,255,255,0.02)] rounded p-4">
        <table class="w-full text-white results-table">
          <thead>
            <tr class="text-sm text-indigo-300">
              <th class="py-2 px-3 text-left">Date</th>
              <th class="py-2 px-3 text-left">Invoice No</th>
              <th class="py-2 px-3 text-left">Type</th>
              <th class="py-2 px-3 text-right">Total (₹)</th>
              <th class="py-2 px-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let inv of invoices" class="border-t border-indigo-500/10">
              <td class="py-3 px-3">{{ inv.date | date }}</td>
              <td class="py-3 px-3">{{ inv.invoiceNo || inv.id || '-' }}</td>
              <td class="py-3 px-3">{{ inv.type || '-' }}</td>
              <td class="py-3 px-3 text-right">{{ inv.totalAmount }}</td>
              <td class="py-3 px-3 text-right">
                <button mat-icon-button color="accent" (click)="openPreview(inv.id)"><mat-icon>visibility</mat-icon></button>
                <button mat-icon-button color="primary" (click)="downloadPdf(inv.id,inv.invoiceNo)"><mat-icon>download</mat-icon></button>
              </td>
            </tr>
            <tr *ngIf="!invoices.length">
              <td colspan="5" class="py-6 text-center text-indigo-300/60">No invoices found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
