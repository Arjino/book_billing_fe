<div class="p-4">
  <div class="flex items-center justify-between mb-2">
    <h2 class="text-lg font-bold">Invoice Preview</h2>
    <button mat-icon-button aria-label="Close" (click)="dialogRef.close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="text-red-600">{{error}}</div>
  <iframe *ngIf="pdfUrl" [src]="pdfUrl" class="w-full h-96 border"></iframe>
  <div class="mt-4">
    <button mat-raised-button color="primary" (click)="downloadPdf()">Download PDF</button>
  </div>
</div>
