<div class="min-h-screen pt-20 pb-12 bg-gradient-to-br from-slate-950 via-purple-900/20 to-slate-950 relative overflow-hidden">
  <!-- Animated Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-purple-500/10 rounded-full blur-3xl animate-blob"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
  </div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <!-- Header -->
    <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-4xl font-extrabold mb-2">
          <span class="bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">Feedback Management</span>
        </h1>
        <p class="text-purple-200">View and submit feedback</p>
      </div>
      <div class="flex gap-3 w-full md:w-auto justify-between md:justify-end mt-4 md:mt-0">
        <button mat-raised-button color="accent" (click)="addFeedback()" class="bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-600 hover:to-indigo-600">
          <mat-icon>add</mat-icon>
          Add Feedback
        </button>
        <button mat-icon-button (click)="goBack()" class="bg-slate-800/50 hover:bg-slate-700/50 text-purple-300 rounded-lg border border-purple-500/30" title="Back to Dashboard">
          <mat-icon>arrow_back</mat-icon>
        </button>
      </div>
    </div>

    <!-- Date Range Filter -->
    <div class="mb-8 bg-gradient-to-br from-slate-800/50 to-slate-900/50 border border-purple-500/30 rounded-2xl p-6 backdrop-blur-xl text-white">
      <h3 class="text-lg font-bold text-purple-300 mb-4 flex items-center gap-2">
        <mat-icon>calendar_today</mat-icon>
        Filter by Date Range
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <mat-form-field appearance="outline" class="w-full text-white">
          <mat-label class="text-white">Start Date</mat-label>
          <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate" placeholder="dd/mm/yyyy" class="text-white placeholder-white" [style.color]="'white'" [max]="maxDate" />
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full text-white">
          <mat-label class="text-white">End Date</mat-label>
          <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate" placeholder="dd/mm/yyyy" class="text-white placeholder-white" [style.color]="'white'" [min]="minEndDate" [max]="maxDate" />
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="filterFeedback()" class="h-14 bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-600 hover:to-indigo-600">
          <mat-icon>search</mat-icon>
          Get Feedback
        </button>
      </div>
    </div>

    <!-- Feedback Table -->
    <div class="bg-gradient-to-br from-slate-900/90 to-slate-950 border border-purple-500/30 rounded-2xl backdrop-blur-xl overflow-hidden text-white">
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="filteredFeedback" class="w-full bg-transparent text-white" *ngIf="filteredFeedback.length">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="text-purple-300 font-bold py-4 px-6 text-left">ID</th>
            <td mat-cell *matCellDef="let f" class="text-purple-300 bg-transparent py-4 px-6 border-t border-purple-500/20">{{f.id}}</td>
          </ng-container>
          
          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef class="text-purple-300 font-bold py-4 px-6 text-left">Category</th>
            <td mat-cell *matCellDef="let f" class="text-purple-300 bg-transparent py-4 px-6 border-t border-purple-500/20">
              <span class="px-3 py-1 rounded-full text-xs font-semibold bg-purple-500/20 text-purple-300">
                {{f.category}}
              </span>
            </td>
          </ng-container>
          
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef class="text-purple-300 font-bold py-4 px-6 text-left">Description</th>
            <td mat-cell *matCellDef="let f" class="text-purple-300 bg-transparent py-4 px-6 border-t border-purple-500/20">
              <div class="max-w-md truncate" [title]="f.description">
                {{f.description}}
              </div>
            </td>
          </ng-container>
          
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef class="text-purple-300 font-bold py-4 px-6 text-left">Created At</th>
            <td mat-cell *matCellDef="let f" class="text-purple-300 bg-transparent py-4 px-6 border-t border-purple-500/20">
              {{ f.createdAt | date:'dd/MM/yyyy hh:mm a' }}
            </td>
          </ng-container>
          
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-purple-500/10 transition-colors"></tr>
        </table>
      </div>
      
      <div *ngIf="!filteredFeedback.length" class="p-8 text-center">
        <mat-icon class="text-6xl text-purple-500/30 mb-4">feedback</mat-icon>
        <p class="text-purple-300/60">No feedback found. Submit your first feedback entry.</p>
      </div>
    </div>
  </div>
</div>
