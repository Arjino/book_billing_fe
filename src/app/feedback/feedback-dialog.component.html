<div class="fd-dialog">

  <!-- Header -->
  <div class="fd-header">
    <h2 class="fd-title">Submit System Feedback</h2>
    <button type="button" class="fd-close" (click)="onCancel()" aria-label="Close dialog">&times;</button>
  </div>

  <div class="fd-body">
    <form #feedbackForm="ngForm">

      <!-- Name -->
      <div class="fd-field">
        <label class="fd-label">Your Name / Business Name:</label>
        <input
          type="text"
          class="fd-input"
          [(ngModel)]="feedback.submittedBy"
          name="submittedBy"
          placeholder="e.g. Anuj Gupta (Anuj Book Depot)"
          autocomplete="off"
        />
      </div>

      <!-- Category + Rating row -->
      <div class="fd-row">
        <div class="fd-field fd-field--half">
          <label class="fd-label">Category:</label>
          <select class="fd-select" [(ngModel)]="feedback.category" name="category" required>
            <option value="" disabled>Select category</option>
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
        </div>
        <div class="fd-field fd-field--half">
          <label class="fd-label">Rating Stars:</label>
          <select class="fd-select fd-select--stars" [(ngModel)]="feedback.rating" name="rating">
            <option *ngFor="let opt of ratingOptions" [ngValue]="opt.value">{{ opt.label }}</option>
          </select>
        </div>
      </div>

      <!-- Message -->
      <div class="fd-field">
        <label class="fd-label">Feedback Message:</label>
        <textarea
          class="fd-textarea"
          [(ngModel)]="feedback.description"
          name="description"
          required
          rows="5"
          placeholder="Describe your suggestion or feedback on the book billing experience..."
          #descriptionModel="ngModel"
        ></textarea>
      </div>

    </form>
  </div>

  <!-- Footer -->
  <div class="fd-footer">
    <button type="button" class="fd-btn fd-btn--cancel" (click)="onCancel()">Cancel</button>
    <button
      type="button"
      class="fd-btn fd-btn--submit"
      (click)="onSubmit()"
      [disabled]="!feedback.category || !feedback.description.trim()"
    >
      Submit Feedback
    </button>
  </div>

</div>
