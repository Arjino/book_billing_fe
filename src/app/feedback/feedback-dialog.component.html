<div class="modern-dialog w-full max-w-lg text-white">
  <div class="dialog-header flex items-center justify-between p-3 rounded-t-lg" style="background: linear-gradient(90deg,#7C3AED,#06B6D4);">
    <div class="flex items-center gap-3">
      <mat-icon>feedback</mat-icon>
      <h2 class="text-lg font-semibold">Submit Feedback</h2>
    </div>
    <button mat-icon-button aria-label="close" (click)="onCancel()"><mat-icon>close</mat-icon></button>
  </div>

  <div mat-dialog-content class="p-4 rounded-b-lg" style="background: rgba(179,71,233,0.14); border: 1px solid rgba(179,71,233,0.95); backdrop-filter: blur(6px);">
    <form #feedbackForm="ngForm">
      <div class="grid grid-cols-1 gap-3">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Category</mat-label>
          <mat-select [(ngModel)]="feedback.category" name="category" required #categoryModel="ngModel" (ngModelChange)="categoryModel.control.markAsTouched()">
            <mat-option *ngFor="let category of categories" [value]="category">{{ category }}</mat-option>
          </mat-select>
          <mat-error *ngIf="categoryModel.invalid && (categoryModel.dirty || categoryModel.touched)">Category is required.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Description</mat-label>
          <textarea
            matInput
            [(ngModel)]="feedback.description"
            name="description"
            required
            rows="5"
            placeholder="Please describe your feedback in detail..."
            #descriptionModel="ngModel"
            (ngModelChange)="descriptionModel.control.markAsTouched()"></textarea>
          <mat-error *ngIf="descriptionModel.invalid && (descriptionModel.dirty || descriptionModel.touched)">Description is required.</mat-error>
        </mat-form-field>
      </div>
    </form>
  </div>

  <div mat-dialog-actions class="flex flex-col md:flex-row md:justify-end gap-2 p-3 bg-[rgba(0,0,0,0.6)] rounded-b-lg">
    <button mat-button class="w-full md:w-auto" (click)="onCancel()" aria-label="Back">
      <mat-icon class="inline md:hidden mr-2">arrow_back</mat-icon>
      <span class="hidden md:inline">Cancel</span>
    </button>
    <button mat-raised-button color="primary" class="w-full md:w-auto" (click)="onSubmit()" [disabled]="feedbackForm.invalid" aria-label="Save">
      <mat-icon class="inline md:hidden mr-2">send</mat-icon>
      <span class="hidden md:inline">Submit</span>
    </button>
  </div>
</div>
