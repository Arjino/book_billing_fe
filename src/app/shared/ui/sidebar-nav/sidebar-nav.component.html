<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">
      <span class="material-icons">menu_book</span>
    </div>
    <div class="brand-text">
      <div class="brand-title-row">
        <span class="brand-title">{{ resolvedBrandTitle }}</span>
        <span class="brand-badge">{{ brandBadge }}</span>
      </div>
      <div class="brand-subtitle">{{ resolvedBrandSubtitle }}</div>
    </div>
  </div>

  <div class="nav-section-label">Navigation Modules</div>

  <nav class="nav-list">
    <a
      *ngFor="let item of items"
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      [title]="item.label">
      <span class="material-icons nav-icon">{{ item.icon }}</span>
      <span class="nav-text">
        <span class="nav-label">{{ item.label }}</span>
        <span class="nav-description">{{ item.description }}</span>
      </span>
      <button
        type="button"
        class="nav-quick-add"
        *ngIf="item.showQuickAdd"
        (click)="onQuickAddClick($event, item)"
        [attr.aria-label]="'Add to ' + item.label"
      >
        <span class="material-icons">add</span>
      </button>
      <span class="nav-badge" *ngIf="item.badgeCount !== undefined">{{ item.badgeCount }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="account-row" [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
      <span class="material-icons account-row-icon">account_circle</span>
      <span class="account-row-text">
        <span class="account-row-name">{{ username }}</span>
        <span class="account-row-role">{{ roleLabel }}</span>
      </span>
      <span class="material-icons account-row-caret">expand_more</span>
    </button>
    <mat-menu #accountMenu="matMenu">
      @if (isSuperAdmin()) {
        <a mat-menu-item routerLink="/company/settings">
          <span class="material-icons">domain</span>
          <span>Company Settings</span>
        </a>
        <a mat-menu-item routerLink="/company/employees">
          <span class="material-icons">badge</span>
          <span>Employees</span>
        </a>
        <a mat-menu-item routerLink="/company/active-parties">
          <span class="material-icons">storefront</span>
          <span>Active Suppliers &amp; Clients</span>
        </a>
      }
      <button mat-menu-item (click)="copyAccessToken()">
        <span class="material-icons">content_copy</span>
        <span>Copy Access Token</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <span class="material-icons">logout</span>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</aside>

<a routerLink="/feedback" class="feedback-tab" aria-label="Feedback">
  <span class="feedback-tab-text">Feedback</span>
</a>
