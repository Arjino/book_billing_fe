<div class="modern-dialog w-full max-w-lg text-white">
  <div class="dialog-header flex items-center justify-between p-3 rounded-t-lg" style="background: linear-gradient(90deg,#06B6D4,#7C3AED);">
    <div class="flex items-center gap-3">
      <mat-icon>payment</mat-icon>
      <h2 class="text-lg font-semibold">Add Transaction</h2>
    </div>
    <button mat-icon-button aria-label="close" (click)="onCancel()"><mat-icon>close</mat-icon></button>
  </div>

  <div mat-dialog-content class="p-4 bg-[rgba(0,0,0,0.6)] rounded-b-lg">
    <form #transactionForm="ngForm">
      <div class="grid grid-cols-1 gap-3">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Party</mat-label>
          <mat-select [(ngModel)]="data.party" name="party" required>
            <mat-option [value]="null">Select Party</mat-option>
            <mat-option *ngFor="let p of parties" [value]="p">{{ p.name }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Transaction Date</mat-label>
          <input matInput type="date" [(ngModel)]="data.paymentDate" name="paymentDate" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Amount</mat-label>
          <input matInput type="number" [(ngModel)]="data.paidAmount" name="amount" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Payment Method</mat-label>
          <mat-select [(ngModel)]="data.paymentMode" name="paymentMethod" required>
            <mat-option *ngFor="let method of paymentMethods" [value]="method">{{ method }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Reference No (Cheque/UTR)</mat-label>
          <input matInput [(ngModel)]="data.referenceNo" name="referenceNo" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Notes</mat-label>
          <textarea matInput [(ngModel)]="data.remarks" name="notes" rows="3"></textarea>
        </mat-form-field>
      </div>
    </form>
  </div>

  <div mat-dialog-actions class="flex justify-end gap-2 p-3 bg-[rgba(0,0,0,0.6)] rounded-b-lg">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSave()">Save Transaction</button>
  </div>
</div>
