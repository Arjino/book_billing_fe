<div class="bg-gradient-to-br from-slate-900 to-slate-950 rounded-lg p-6 h-full flex flex-col">
  <!-- Header -->
  <div class="flex items-center justify-between mb-4 pb-4 border-b border-slate-700">
    <div class="flex items-center gap-3">
      <mat-icon class="text-purple-400 text-3xl">receipt</mat-icon>
      <h2 class="text-2xl font-bold text-white">Payment Receipt</h2>
    </div>
    <button mat-icon-button (click)="closeDialog()" class="text-slate-400 hover:text-white">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <mat-icon class="text-purple-400 animate-spin text-5xl mb-4">refresh</mat-icon>
      <p class="text-slate-300">Loading receipt...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <mat-icon class="text-red-400 text-5xl mb-4">error_outline</mat-icon>
      <p class="text-red-300">{{ error }}</p>
    </div>
  </div>

  <!-- PDF Viewer -->
  <div *ngIf="pdfUrl && !loading && !error" class="flex-1 bg-slate-800 rounded-lg overflow-hidden mb-4">
    <iframe [src]="pdfUrl" class="w-full h-full border-0"></iframe>
  </div>

  <!-- Action Buttons -->
  <div *ngIf="pdfUrl && !loading && !error" class="flex gap-3 mt-4">
    <button
      mat-raised-button
      color="primary"
      (click)="downloadPdf()"
      class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700"
    >
      <mat-icon class="mr-2">download</mat-icon>
      Download Receipt
    </button>
    <button
      mat-stroked-button
      (click)="closeDialog()"
      class="flex-1 border-slate-600 text-slate-300 hover:bg-slate-800"
    >
      Close
    </button>
  </div>
</div>
