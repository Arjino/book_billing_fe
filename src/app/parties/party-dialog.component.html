<div class="modern-dialog w-full max-w-lg text-white">
  <div class="dialog-header flex items-center justify-between p-3 rounded-t-lg" style="background: linear-gradient(90deg,#FF7A59,#FF3CAC);">
    <div class="flex items-center gap-3">
      <mat-icon>people</mat-icon>
      <h2 class="text-lg font-semibold">Add Party</h2>
    </div>
    <button mat-icon-button aria-label="close" (click)="onCancel()"><mat-icon>close</mat-icon></button>
  </div>

  <div mat-dialog-content class="p-4 rounded-b-lg" style="background: rgba(179,71,233,0.14); border: 1px solid rgba(179,71,233,0.95); backdrop-filter: blur(6px);">
    <form #partyForm="ngForm">
      <div class="grid grid-cols-1 gap-3">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="data.name" name="name" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Type (Customer / Supplier)</mat-label>
          <input matInput [(ngModel)]="data.type" name="type" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Phone</mat-label>
          <input matInput [(ngModel)]="data.phone" name="phone" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Address</mat-label>
          <textarea matInput [(ngModel)]="data.address" name="address" required rows="3"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>GSTIN</mat-label>
          <input matInput [(ngModel)]="data.gstin" name="gstin" required />
        </mat-form-field>
      </div>
    </form>
  </div>

  <div mat-dialog-actions class="flex justify-end gap-2 p-3 bg-[rgba(0,0,0,0.6)] rounded-b-lg">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSave()">Save</button>
  </div>
</div>
