<div class="min-h-screen pt-20 pb-12 bg-gradient-to-br from-slate-950 via-orange-900/20 to-slate-950 relative overflow-hidden">
  <!-- Animated Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-orange-500/10 rounded-full blur-3xl animate-blob"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
  </div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <!-- Header -->
    <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-4xl font-extrabold mb-2">
          <span class="bg-gradient-to-r from-orange-400 to-amber-400 bg-clip-text text-transparent">Parties Management</span>
        </h1>
        <p class="text-orange-200">Manage your clients and parties</p>
      </div>
      <div class="flex gap-3 w-full md:w-auto justify-between md:justify-end mt-4 md:mt-0">
        <button mat-raised-button color="accent" (click)="addParty()" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600">
          <mat-icon>add</mat-icon>
          Add Party
        </button>
        <button mat-icon-button (click)="goBack()" class="bg-slate-800/50 hover:bg-slate-700/50 text-orange-300 rounded-lg border border-orange-500/30" title="Back to Dashboard">
          <mat-icon>arrow_back</mat-icon>
        </button>
      </div>
    </div>

    <!-- Filter Section -->
    <div class="mb-6 bg-gradient-to-br from-slate-900/90 to-slate-950 border border-orange-500/30 rounded-2xl backdrop-blur-xl p-6 text-white">
      <div class="flex flex-col md:flex-row gap-4 items-end">
        <!-- Filter Dropdown -->
        <div class="flex-1">
          <label class="block text-orange-300 font-semibold mb-2">Filter By</label>
          <select [(ngModel)]="filterBy" class="w-full px-4 py-2 bg-slate-800/50 border border-orange-500/30 rounded-lg text-white focus:outline-none focus:border-orange-400 transition-colors">
            <option *ngFor="let option of filterOptions" [value]="option.value">
              {{option.label}}
            </option>
          </select>
        </div>

        <!-- Filter Input -->
        <div class="flex-1">
          <label class="block text-orange-300 font-semibold mb-2">Search Value</label>
          <input 
            [(ngModel)]="filterValue" 
            (keyup.enter)="applyFilter()"
            type="text" 
            placeholder="Enter filter value..." 
            class="w-full px-4 py-2 bg-slate-800/50 border border-orange-500/30 rounded-lg text-white placeholder-orange-300/40 focus:outline-none focus:border-orange-400 transition-colors"
          />
        </div>

        <!-- Filter Button -->
        <button 
          (click)="applyFilter()" 
          mat-raised-button 
          class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-semibold px-6 py-2 rounded-lg transition-all"
        >
          <mat-icon class="mr-2">search</mat-icon>
          Apply Filter
        </button>

        <!-- Clear Button -->
        <button 
          (click)="clearFilter()" 
          mat-outlined-button 
          class="border border-orange-500/50 text-orange-300 hover:bg-orange-500/10 font-semibold px-6 py-2 rounded-lg transition-all"
        >
          <mat-icon class="mr-2">clear</mat-icon>
          Clear
        </button>
      </div>
    </div>

    <!-- Table Container -->
    <div class="bg-gradient-to-br from-slate-900/90 to-slate-950 border border-orange-500/30 rounded-2xl backdrop-blur-xl overflow-hidden text-white">
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="filteredParties" class="w-full bg-transparent text-white" *ngIf="filteredParties.length">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">ID</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">{{p.id}}</td>
          </ng-container>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">Name</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">{{p.name}}</td>
          </ng-container>
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">Type</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">{{p.type}}</td>
          </ng-container>
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">Phone</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">{{p.phone}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">Actions</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">
              <button mat-icon-button (click)="editParty(p)" class="text-blue-400 hover:text-blue-300" title="Edit Party">
                <mat-icon>edit</mat-icon>
              </button>
              <button *ngIf="partyStatus === 'current'" mat-icon-button (click)="deleteParty(p)" class="text-red-400 hover:text-red-300 ml-2" title="Delete Party">
                <mat-icon>delete</mat-icon>
              </button>
              <button *ngIf="partyStatus === 'old'" mat-icon-button (click)="enableParty(p)" class="text-green-400 hover:text-green-300 ml-2" title="Enable Party">
                <mat-icon>check_circle</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="['id','name','type','phone','actions']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['id','name','type','phone','actions'];" class="hover:bg-orange-500/10 transition-colors"></tr>
        </table>
      </div>
      <div *ngIf="!filteredParties.length" class="p-8 text-center">
        <mat-icon class="text-6xl text-orange-500/30 mb-4">business</mat-icon>
        <p class="text-orange-300/60" *ngIf="filterValue">No results found for your filter.</p>
        <p class="text-orange-300/60" *ngIf="!filterValue">No parties found. Create your first party entry.</p>
      </div>
    </div>
  </div>
</div>
