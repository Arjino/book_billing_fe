<div class="min-h-screen pt-20 pb-12 bg-gradient-to-br from-slate-950 via-orange-900/20 to-slate-950 relative overflow-hidden">
  <!-- Animated Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-orange-500/10 rounded-full blur-3xl animate-blob"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
  </div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <!-- Header -->
    <div class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-4xl font-extrabold mb-2">
          <span class="bg-gradient-to-r from-orange-400 to-amber-400 bg-clip-text text-transparent">Parties Management</span>
        </h1>
        <p class="text-orange-200">Manage your clients and parties</p>
      </div>
      <div class="flex gap-3">
        <button mat-raised-button color="accent" (click)="addParty()" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600">
          <mat-icon>add</mat-icon>
          Add Party
        </button>
        <button mat-icon-button (click)="goBack()" class="bg-slate-800/50 hover:bg-slate-700/50 text-orange-300 rounded-lg border border-orange-500/30" title="Back to Dashboard">
          <mat-icon>arrow_back</mat-icon>
        </button>
      </div>
    </div>

    <!-- Table Container -->
    <div class="bg-gradient-to-br from-slate-900/90 to-slate-950 border border-orange-500/30 rounded-2xl backdrop-blur-xl overflow-hidden text-white">
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="parties" class="w-full bg-transparent text-white" *ngIf="parties.length">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">ID</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">{{p.id}}</td>
          </ng-container>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">Name</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">{{p.name}}</td>
          </ng-container>
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">Type</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">{{p.type}}</td>
          </ng-container>
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef class="text-orange-300 font-bold py-4 px-6 text-left">Phone</th>
            <td mat-cell *matCellDef="let p" class="text-orange-300 bg-transparent py-4 px-6 border-t border-orange-500/20">{{p.phone}}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="['id','name','type','phone']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['id','name','type','phone'];" class="hover:bg-orange-500/10 transition-colors"></tr>
        </table>
      </div>
      <div *ngIf="!parties.length" class="p-8 text-center">
        <mat-icon class="text-6xl text-orange-500/30 mb-4">business</mat-icon>
        <p class="text-orange-300/60">No parties found. Create your first party entry.</p>
      </div>
    </div>
  </div>
</div>
