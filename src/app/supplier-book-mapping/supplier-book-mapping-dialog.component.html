<div class="modern-dialog max-w-2xl text-white">
  <div class="dialog-header flex items-center justify-between p-3 rounded-t-lg" style="background: linear-gradient(90deg,#0EA5E9,#7C3AED);">
    <div class="flex items-center gap-3">
      <mat-icon>local_shipping</mat-icon>
      <h2 class="text-lg font-semibold">Add Supplier Books</h2>
    </div>
    <button mat-icon-button aria-label="close" (click)="cancel()"><mat-icon>close</mat-icon></button>
  </div>

  <div mat-dialog-content class="p-4 rounded-b-lg" style="background: rgba(179,71,233,0.14); border: 1px solid rgba(179,71,233,0.95); backdrop-filter: blur(6px);">
    <form [formGroup]="form" class="grid grid-cols-1 gap-4">
      <div class="space-y-3">
        <div class="text-sm text-slate-950 font-bold">Books & Discounts</div>

        <div class="grid grid-cols-1 md:grid-cols-7 gap-3 items-start" *ngFor="let row of rows; let i = index">
          <mat-form-field appearance="outline" class="w-full md:col-span-4">
            <mat-label>Book</mat-label>
            <input
              matInput
              [formControl]="row.bookCtrl"
              [matAutocomplete]="bookAuto"
              placeholder="Search book"
            />
          </mat-form-field>

          <mat-autocomplete #bookAuto="matAutocomplete" [displayWith]="displayBook" (optionSelected)="onBookSelected(i, $event.option.value)">
            <mat-option *ngFor="let book of (row.filteredBooks$ | async)" [value]="book">
              {{ book.title }} ({{ book.sku || 'N/A' }})
            </mat-option>
          </mat-autocomplete>

          <ng-container *ngIf="getDiscountEntry(i) as entry">
            <mat-form-field appearance="outline" class="w-full md:col-span-2">
              <mat-label>Discount %</mat-label>
              <input
                matInput
                type="number"
                [ngModel]="entry?.percent"
                (ngModelChange)="entry && (entry.percent = $event)"
                [ngModelOptions]="{ standalone: true }"
                min="0"
                max="100"
                step="0.01"
                [disabled]="!entry"
              />
            </mat-form-field>
          </ng-container>

          <div class="flex md:justify-center md:items-start md:col-span-1">
            <button mat-icon-button color="warn" (click)="removeRow(i)" [disabled]="rows.length === 1">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>

        <div class="flex justify-end">
          <button mat-stroked-button color="primary" type="button" (click)="addRow()">
            Add Row
          </button>
        </div>
        <mat-error *ngIf="form.get('bookIds')?.touched && form.get('bookIds')?.invalid">
          Please select at least one book.
        </mat-error>
      </div>
    </form>
  </div>

  <div mat-dialog-actions class="flex justify-end gap-2 p-3 bg-[rgba(0,0,0,0.6)] rounded-b-lg">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
      Save
    </button>
  </div>
</div>
