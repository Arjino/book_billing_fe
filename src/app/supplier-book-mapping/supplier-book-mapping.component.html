<div class="min-h-screen pt-20 pb-12 bg-gradient-to-br from-slate-950 via-cyan-900/20 to-slate-950 relative overflow-hidden">
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl animate-blob"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-teal-500/10 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
  </div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-4xl font-extrabold mb-2">
          <span class="bg-gradient-to-r from-cyan-400 to-teal-400 bg-clip-text text-transparent">Supplier Book Mapping</span>
        </h1>
        <p class="text-cyan-200">Manage allowed books for each supplier</p>
      </div>
      <div class="flex justify-end">
        <button mat-icon-button (click)="goBack()" class="bg-slate-800/50 hover:bg-slate-700/50 text-cyan-300 rounded-lg border border-cyan-500/30" title="Back to Books">
          <mat-icon>arrow_back</mat-icon>
        </button>
      </div>
    </div>

    <div class="mb-6 bg-gradient-to-br from-slate-900/90 to-slate-950 border border-cyan-500/30 rounded-2xl backdrop-blur-xl p-6 text-white">
      <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
        <mat-form-field appearance="outline" class="w-full md:col-span-1">
          <mat-label>Supplier</mat-label>
          <mat-select formControlName="supplierId" required>
            <mat-option [value]="null">Select Supplier</mat-option>
            <mat-option *ngFor="let supplier of suppliers" [value]="supplier.id">
              {{ supplier.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('supplierId')?.touched && form.get('supplierId')?.invalid">
            Supplier is required.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full md:col-span-1">
          <mat-label>Filter Books</mat-label>
          <input matInput [formControl]="filterControl" placeholder="Search by title or SKU" />
        </mat-form-field>

        <div class="flex gap-2 justify-center items-center">
          <button mat-stroked-button color="accent" type="button" (click)="clearFilter()" [disabled]="!filterControl.value">
            <mat-icon>clear</mat-icon>
            Clear
          </button>
          <button mat-raised-button color="primary" type="button" (click)="openAddBookDialog()" [disabled]="!selectedSupplierId">
            <mat-icon>add</mat-icon>
            Add Book
          </button>
        </div>
      </form>
    </div>

    <div class="bg-gradient-to-br from-slate-900/90 to-slate-950 border border-cyan-500/30 rounded-2xl backdrop-blur-xl overflow-hidden text-white">
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="dataSource" matSort class="w-full bg-transparent table-fixed" *ngIf="dataSource.data.length">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-cyan-300 font-bold py-4 px-6 text-left">Book</th>
            <td mat-cell *matCellDef="let row" class="py-4 px-6 border-t border-cyan-500/20">{{ row.book.title }}</td>
          </ng-container>

          <ng-container matColumnDef="sku">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-cyan-300 font-bold py-4 px-6 text-left">SKU</th>
            <td mat-cell *matCellDef="let row" class="py-4 px-6 border-t border-cyan-500/20">{{ row.book.sku || '-' }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-cyan-300 font-bold py-4 px-6 text-left">Action</th>
            <td mat-cell *matCellDef="let row" class="py-4 px-6 border-t border-cyan-500/20">
              <div class="flex items-center gap-2">
                <button
                  mat-icon-button
                  (click)="toggleEditSave(row)"
                  class="text-emerald-400 hover:text-emerald-300"
                  [title]="row.isEditing ? 'Save Discount' : 'Edit Discount'"
                >
                  <mat-icon>{{ row.isEditing ? 'save' : 'edit' }}</mat-icon>
                </button>
                <button
                  *ngIf="!row.isEditing"
                  mat-icon-button
                  (click)="deleteDiscountAndUnmap(row)"
                  class="text-red-400 hover:text-red-300"
                  title="Delete Mapping"
                >
                  <mat-icon>delete</mat-icon>
                </button>
                <button
                  *ngIf="row.isEditing"
                  mat-icon-button
                  (click)="cancelEdit(row)"
                  class="text-amber-400 hover:text-amber-300"
                  title="Cancel"
                >
                  <mat-icon>close</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="discountPercent">
            <th mat-header-cell *matHeaderCellDef class="text-cyan-300 font-bold py-4 px-6 text-left">Discount (%)</th>
            <td mat-cell *matCellDef="let row" class="py-4 px-6 border-t border-cyan-500/20 align-middle">
              <div class="flex justify-center items-center">
              <mat-form-field appearance="outline" class="w-28" [ngClass]="{ 'edit-mode': row.isEditing }">
                <input matInput type="number" [(ngModel)]="row.discountPercent" [ngModelOptions]="{ standalone: true }" min="0" max="100" step="0.01" [disabled]="!row.isEditing" />
              </mat-form-field>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-cyan-500/10 transition-colors"></tr>
        </table>
      </div>

      <div *ngIf="!dataSource.data.length" class="p-8 text-center">
        <mat-icon class="text-6xl text-cyan-500/30 mb-4">library_books</mat-icon>
        <p class="text-cyan-200/70">Select a supplier to view mapped books.</p>
      </div>
    </div>
  </div>
</div>
