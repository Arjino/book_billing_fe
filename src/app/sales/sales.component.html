<div class="p-6">
  <h2 class="text-xl font-bold mb-4">Sales
    <button mat-raised-button color="primary" (click)="addSale()" class="ml-4">Add</button>
  </h2>

  <!-- Date Range Filter -->
  <div class="mb-6 p-4 bg-gray-50 rounded-lg">
    <h3 class="text-sm font-semibold text-gray-700 mb-3">Filter by Date Range</h3>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate" placeholder="YYYY-MM-DD">
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate" placeholder="YYYY-MM-DD">
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="getSalesByDateRange()" class="h-14">Get Sales</button>
    </div>
  </div>

  <!-- Sales Table -->
  <table mat-table [dataSource]="sales" class="w-full mb-6" *ngIf="sales.length">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let s">{{s.id}}</td>
    </ng-container>
    <ng-container matColumnDef="invoiceNo">
      <th mat-header-cell *matHeaderCellDef>Invoice No</th>
      <td mat-cell *matCellDef="let s">{{s.invoiceNo}}</td>
    </ng-container>
    <ng-container matColumnDef="party">
      <th mat-header-cell *matHeaderCellDef>Party</th>
      <td mat-cell *matCellDef="let s">{{s.party?.name}}</td>
    </ng-container>
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let s">{{s.date}}</td>
    </ng-container>
    <ng-container matColumnDef="grandTotal">
      <th mat-header-cell *matHeaderCellDef>Grand Total</th>
      <td mat-cell *matCellDef="let s">{{s.grandTotal | currency}}</td>
    </ng-container>
    <ng-container matColumnDef="paymentStatus">
      <th mat-header-cell *matHeaderCellDef>Payment Status</th>
      <td mat-cell *matCellDef="let s">
        <span [ngClass]="s.paymentStatus === 'Paid' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'" class="px-2 py-1 rounded text-xs font-semibold">
          {{s.paymentStatus}}
        </span>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['id','invoiceNo','party','date','grandTotal','paymentStatus']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id','invoiceNo','party','date','grandTotal','paymentStatus'];"></tr>
  </table>
  <div *ngIf="!sales.length" class="text-gray-500">No sales found.</div>
</div>
